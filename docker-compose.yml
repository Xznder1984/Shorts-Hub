services:
  backend:
    build:
      context: ./backend
    container_name: shortshub-backend
    env_file:
      - path: .env
        required: false
    environment:
      - SHORTS_DB=/data/shorts.db
    volumes:
      - shortshub-data:/data
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: shortshub-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: shortshub-caddy
    depends_on:
      - frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shortshub-data:
  caddy-data:
  caddy-config:
